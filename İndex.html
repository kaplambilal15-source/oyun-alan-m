<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Kalp Avı Oyunu</title>

<style>

body{
text-align:center;
font-family:Arial;
background:#1e1e2f;
color:white;
overflow:hidden;
}

h1{
margin-top:10px;
}

#scoreBoard{
font-size:20px;
margin:10px;
}

#gameArea{
width:100%;
height:70vh;
position:relative;
border:2px solid #444;
margin-top:10px;
}

.heart{
position:absolute;
font-size:60px;
cursor:pointer;
}

#startBtn{
padding:12px 20px;
font-size:18px;
margin-top:10px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>❤️ Kalp Avı Oyunu</h1>

<div id="scoreBoard">
Puan: <span id="score">0</span> |
Süre: <span id="time">30</span> |
Rekor: <span id="best">0</span>
</div>

<button id="startBtn" onclick="startGame()">Oyunu Başlat</button>

<div id="gameArea"></div>

<script>

let score=0
let time=30
let game=false
let timer
let bestScore=localStorage.getItem("bestScore") || 0

document.getElementById("best").innerText=bestScore

function startGame(){

score=0
time=30
game=true

document.getElementById("score").innerText=score
document.getElementById("time").innerText=time

timer=setInterval(function(){

time--
document.getElementById("time").innerText=time

spawnHeart()

if(time<=0){
endGame()
}

},1000)

}

function spawnHeart(){

if(!game)return

let area=document.getElementById("gameArea")

let heart=document.createElement("div")

let gold=Math.random()<0.2

heart.innerHTML=gold?"💛":"❤️"

heart.className="heart"

heart.style.left=Math.random()*90+"%"
heart.style.top=Math.random()*80+"%"

heart.onclick=function(){

if(gold){
score+=5
}else{
score+=1
}

document.getElementById("score").innerText=score

heart.remove()

}

area.appendChild(heart)

setTimeout(()=>{
heart.remove()
},1500)

}

function endGame(){

clearInterval(timer)
game=false

if(score>bestScore){
bestScore=score
localStorage.setItem("bestScore",bestScore)
}

document.getElementById("best").innerText=bestScore

alert("Oyun bitti! Puanın: "+score)

document.getElementById("gameArea").innerHTML=""

}

</script>

</body>
  </html>
